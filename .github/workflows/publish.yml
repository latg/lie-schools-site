name: Publish site
on: push
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.59.1"

      - name: Build
        run: hugo

      - name: upload to VPS
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          host: "test.lie-school.ru"
          privateKey: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          localDir: "./public"
          remoteDir: "/root/webserver/public"
          removeExtraFilesOnServer: true
